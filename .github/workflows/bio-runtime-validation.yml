name: Bio runtime validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'bio-analysis/**'
      - '.github/workflows/bio-runtime-validation.yml'
  pull_request:
    paths:
      - 'bio-analysis/**'
      - '.github/workflows/bio-runtime-validation.yml'
permissions:
  contents: read
jobs:
  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r bio-analysis/requirements.txt
      - name: Verify actual engine execution through the API
        run: python bio-analysis/test_bio_api.py -v
