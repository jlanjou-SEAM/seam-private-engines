name: Event-Forcast Collect (Realtime)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout backend repo (self)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: backend

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run realtime collectors
        env:
          SEAM_OUTPUT_ROOT: ${{ github.workspace }}/backend/event-forcast
          SEAM_ROOT: ${{ github.workspace }}/backend/event-forcast
          SEAM_RETRIEVAL_MODE: live
          SEAM_BACKFILL_HOURS: 0
          SEAM_RUN_ONCE: 1
          SEAM_COLLECTOR_TIMEOUT_SECONDS: 10
        run: |
          cd ${{ github.workspace }}/backend/event-forcast/step1_raw_data_retrieval
          echo "Starting collectors from: $(pwd)"
          echo "Collectors should be at: ${{ github.workspace }}/backend/event-forcast/collectors"
          ls -la ${{ github.workspace }}/backend/event-forcast/collectors/ 2>/dev/null | head -10 || echo "Collectors dir missing!"
          python realtime_acquisition.py 2>&1 | tee collector_output.log
          echo "Collectors complete."

      - name: Checkout public frontend repo
        uses: actions/checkout@v4
        with:
          repository: jlanjou-SEAM/Continuum-Event-Forcast
          fetch-depth: 1
          path: frontend
          token: ${{ secrets.SEAM_GITHUB_TOKEN }}

      - name: Generate live.json from manifold analysis
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path

          manifold_file = Path("${{ github.workspace }}/backend/event-forcast/continuum/output/volcanic_manifold_analysis.json")

          if manifold_file.exists():
              with open(manifold_file, 'r') as f:
                  manifold = json.load(f)

              # Extract volcanic events from matches
              volcanic_events = []
              if 'matches' in manifold:
                  for match in manifold['matches']:
                      if match.get('signature_class') == 'volcanic':
                          event = {
                              "event_id": match.get('event_id'),
                              "signature_class": "volcanic",
                              "primary_regime": "volcanic",
                              "first_detected_utc": match.get('timestamp_utc'),
                              "status": "active",
                              "location": {
                                  "best_effort_lat": match.get('latitude'),
                                  "best_effort_lon": match.get('longitude'),
                                  "region": match.get('spatial_region'),
                                  "city": "Unknown",
                                  "state_province": "Unknown",
                                  "country": "Unknown"
                              },
                              "signal_summary": match.get('signal_summary', '{}'),
                              "projected_event_time": match.get('projected_event_time'),
                              "magnitude": match.get('magnitude'),
                              "confidence_history": [
                                  {
                                      "timestamp_utc": match.get('timestamp_utc'),
                                      "seam_phi": match.get('seam_phi', 0),
                                      "phase": "warning" if match.get('seam_phi', 0) < 0.85 else "event",
                                      "magnitude": match.get('magnitude')
                                  }
                              ]
                          }
                          volcanic_events.append(event)

              # Create live.json
              live_data = {
                  "schema": "SEAM_LIVE_FEED_V1",
                  "generated_utc": manifold.get('generated_utc'),
                  "sources_loaded": 118,
                  "event_count": len(volcanic_events),
                  "events": volcanic_events
              }

              # Write to frontend
              output_dir = Path("${{ github.workspace }}/frontend/public/data")
              output_dir.mkdir(parents=True, exist_ok=True)
              with open(output_dir / "live.json", 'w') as f:
                  json.dump(live_data, f, indent=2)

              print(f"Generated live.json with {len(volcanic_events)} volcanic events")
          else:
              print(f"Manifold file not found at {manifold_file}")
          EOF

      - name: Copy collected data to frontend repo
        run: |
          # Copy data from backend to frontend
          for dir in realtime nonrealtime official streams state continuum; do
            if [ -d "${{ github.workspace }}/backend/event-forcast/$dir" ]; then
              mkdir -p "${{ github.workspace }}/frontend/$dir"
              cp -r "${{ github.workspace }}/backend/event-forcast/$dir"/* "${{ github.workspace }}/frontend/$dir/" 2>/dev/null || true
            fi
          done

      - name: Commit and push to frontend repo
        run: |
          cd ${{ github.workspace }}/frontend
          git config user.name "SEAM Bot"
          git config user.email "seam@github.local"
          # Add all directories including public/data
          for dir in realtime nonrealtime official streams state continuum public; do
            if [ -d "$dir" ]; then
              git add -A "$dir/"
            fi
          done
          if ! git diff --quiet --cached; then
            git commit -m "chore: realtime data collection [skip ci]"
            git push origin main
          else
            echo "No changes to commit"
          fi
