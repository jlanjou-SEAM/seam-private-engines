name: Event-Forcast Collect (Realtime)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout backend repo (self)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: backend

      - name: Install build tools and libcurl
        run: |
          apt-get update
          apt-get install -y build-essential libcurl4-openssl-dev

      - name: Build C-based multi-cycle runner
        run: |
          cd ${{ github.workspace }}/backend/event-forcast
          bash build.sh

      - name: Run Multi-Cycle Collection Pipeline (C-optimized, ~60-90s)
        run: |
          cd ${{ github.workspace }}/backend/event-forcast
          echo "Starting C-based high-performance runner: 6,746 verified sources"
          time ./multi_cycle_runner 2>&1 | tee collection.log
          echo "Collection complete"
          ls -lh continuum/continuum_combined_registry.json

      - name: Copy cycle logs to frontend
        run: |
          mkdir -p ${{ github.workspace }}/frontend/continuum
          cp -v ${{ github.workspace }}/backend/event-forcast/continuum/cycle_log.json ${{ github.workspace }}/frontend/continuum/ 2>/dev/null || echo "cycle_log.json not yet available"
          cp -v ${{ github.workspace }}/backend/event-forcast/continuum/event_tracker.json ${{ github.workspace }}/frontend/continuum/ 2>/dev/null || echo "event_tracker.json not yet available"

      - name: Checkout public frontend repo
        uses: actions/checkout@v4
        with:
          repository: jlanjou-SEAM/Continuum-Event-Forcast
          fetch-depth: 1
          path: frontend
          token: ${{ secrets.SEAM_GITHUB_TOKEN }}

      - name: Generate live.json from event tracker
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          tracker_file = Path("${{ github.workspace }}/backend/event-forcast/continuum/event_tracker.json")

          if not tracker_file.exists():
              live_data = {
                  "schema": "SEAM_LIVE_FEED_V1",
                  "generated_utc": datetime.now(timezone.utc).isoformat(),
                  "sources_loaded": 118,
                  "event_count": 0,
                  "events": []
              }
          else:
              with open(tracker_file, 'r') as f:
                  tracker = json.load(f)

              volcanic_events = []
              if 'events' in tracker:
                  for event_id, event_data in tracker['events'].items():
                      if event_data.get('signature_class') == 'volcanic' and event_data.get('status') == 'active':
                          volcanic_events.append(event_data)

              live_data = {
                  "schema": "SEAM_LIVE_FEED_V1",
                  "generated_utc": tracker.get('generated_utc', datetime.now(timezone.utc).isoformat()),
                  "sources_loaded": 118,
                  "event_count": len(volcanic_events),
                  "events": volcanic_events
              }

          output_dir = Path("${{ github.workspace }}/frontend/public/data")
          output_dir.mkdir(parents=True, exist_ok=True)
          with open(output_dir / "live.json", 'w') as f:
              json.dump(live_data, f, indent=2)

          print(f"Generated live.json with {len(volcanic_events)} volcanic events")
          EOF

      - name: Copy collected data to frontend repo
        run: |
          # Copy data from backend to frontend
          for dir in realtime nonrealtime official streams state continuum; do
            if [ -d "${{ github.workspace }}/backend/event-forcast/$dir" ]; then
              mkdir -p "${{ github.workspace }}/frontend/$dir"
              cp -r "${{ github.workspace }}/backend/event-forcast/$dir"/* "${{ github.workspace }}/frontend/$dir/" 2>/dev/null || true
            fi
          done

      - name: Commit and push to frontend repo
        run: |
          cd ${{ github.workspace }}/frontend
          git config user.name "SEAM Bot"
          git config user.email "seam@github.local"
          # Add all directories including public/data and cycle logs
          for dir in realtime nonrealtime official streams state continuum public; do
            if [ -d "$dir" ]; then
              git add -A "$dir/"
            fi
          done
          if ! git diff --quiet --cached; then
            git commit -m "chore: realtime data collection + cycle timing logs [skip ci]"
            git push origin main
            echo "✓ Pushed to frontend repo with cycle logs"
          else
            echo "No changes to commit"
          fi
