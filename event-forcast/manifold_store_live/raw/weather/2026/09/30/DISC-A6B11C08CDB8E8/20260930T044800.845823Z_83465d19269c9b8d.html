<!DOCTYPE html>
<html>
<head>
    <!-- Version: {{version}}, Last update: {{buildDate}} -->

    <title>Caribbean and Adjacent Regions Tsunami Sources and Models (CATSAM)</title>
    <link rel="shortcut icon" href="https://www.ngdc.noaa.gov/image/favicon.ico">
    <link rel="stylesheet" href="https://js.arcgis.com/3.44/dijit/themes/tundra/tundra.css" />
    <link rel="stylesheet" href="https://js.arcgis.com/3.44/esri/css/esri.css">

    <link rel="stylesheet" href="https://www.ncei.noaa.gov/maps/dijits/js/ngdc/css/MapToolbar.css">
    <link rel="stylesheet" href="https://www.ncei.noaa.gov/maps/dijits/js/ngdc/identify/IdentifyPane.css">
    <link rel="stylesheet" href="https://www.ncei.noaa.gov/maps/dijits/js/ngdc/themes/tundra/BoundingBoxDialog.css">
    <!-- GWR <link rel="stylesheet" href="https://www.ncei.noaa.gov/maps/dijits/js/ngdc/css/Banner.css"> -->
    <link rel="stylesheet" href="https://www.ncei.noaa.gov/maps/dijits/js/ngdc/css/CoordinatesWithElevationToolbar.css">

    <link rel="stylesheet" type="text/css" href="https://js.arcgis.com/3.44/dojox/layout/resources/FloatingPane.css"/>
    <link rel="stylesheet" type="text/css" href="https://js.arcgis.com/3.44/dojox/layout/resources/ResizeHandle.css"/>

    <link rel="stylesheet" href="js/app/css/CreditsPanel.css">
    <link rel="stylesheet" href="js/app/css/NCEIBanner.css">
    <link rel="stylesheet" href="js/app/css/NCEIFooter.css">

    <!-- Growler: css -->
    <link rel="stylesheet" href="https://www.ncei.noaa.gov/maps/dijits/js/ncei/Growler.css">

    <link rel="stylesheet" href="css/local.css">

    <!-- Growler: div style -->
    <style>
        .upperRight {
            position: absolute;
            top: 10px;
            right: 20px;
            z-index: 999;
            width: 450px;
        }
    </style>

    <script>
        var dojoConfig = {
            waitSeconds: 5,
            async: true,
            parseOnLoad: false,

            //list local packages
            packages: [
            {
                name: "ngdc",
                location: 'https://www.ncei.noaa.gov/maps/dijits/js/ngdc'
            },
            {
                name: "app",
                location: location.pathname.replace(/\/[^/]*$/, '') + '/js/app'
            },
            {
                name: "ncei",
                location: 'https://www.ncei.noaa.gov/maps/dijits/js/ncei'
            }
            ],

            //app-specific config values
            app: {
                loglevel: 5,
                ngdcDijitsUrl: 'https://www.ncei.noaa.gov/maps/dijits/js/ngdc'
            }
        };
    </script>
    <script src="https://js.arcgis.com/3.44/"></script>
</head>
<body class="tundra">
<div id="loadingOverlay" class="loadingOverlay pageOverlay">
    <div id="loaderInner"></div>
</div>

<div id="busy"></div>

<div id="mainWindow" class="noBorder" data-dojo-type="dijit/layout/BorderContainer" data-dojo-props="design:'headline', gutters:false">

    <div id="header" data-dojo-type="dijit/layout/ContentPane" data-dojo-props="region:'top'">
        <div id="banner"></div>
    </div>

    <div id="leftPane" data-dojo-type="dijit/layout/AccordionContainer" data-dojo-props="region:'left', splitter:true">
        <div id="layersPanel" data-dojo-type="dijit/layout/ContentPane" title="Layers">
        </div>
        <div id="aboutPanel" data-dojo-type="dijit/layout/ContentPane" title="More Information">
            <div id="credits" data-dojo-type="app/CreditsPanel"></div>
        </div>
        <div id="helpPanel" data-dojo-type="dijit/layout/ContentPane" title="Help">
            <div id="help" data-dojo-type="app/HelpPanel"></div>
        </div>

    </div> <!-- end leftPane -->

    <!-- mapContainer nested inside ContentPane because it seems to force map to initially fill pane -->
    <div id="centerPane" data-dojo-type="dijit/layout/ContentPane" data-dojo-props="region:'center'">

        <!-- Growler: div -->
        <div class="upperRight">
            <div id="growlerDijit"></div>
        </div>

        <div id="mercator" data-dojo-type="dijit/layout/ContentPane" title="Mercator" class="map" data-dojo-props="iconClass:'mercatorTabIcon', showTitle: false, tooltip: 'Mercator'">
            <div id="mercatorMapToolbar"></div>
            <div id="mercatorCoordinatesToolbar"></div>
        </div>
    </div> <!-- end centerPane -->

    <!-- footer -->
    <div id="footer" data-dojo-type="dijit/layout/ContentPane" data-dojo-props="region:'bottom'">
        <div id="footer-content">
            <div id="footer-structure"></div>
        </div>
    </div>

</div> <!-- end mainWindow BorderContainer -->
<div id="identifyPaneDiv"></div>
<script>
    //unless the Dijit is listed in the require list, it cannot be addressed via the registry
    require([
        "ngdc/LoadingOverlay", "dojo/parser", "app/AppLoader",
        "dijit/layout/BorderContainer", "dijit/layout/ContentPane", "dijit/layout/AccordionContainer", "dijit/layout/TabContainer",
        "app/HelpPanel", "app/CreditsPanel", "dojo/domReady!" ],
            function(LoadingOverlay, parser, AppLoader) {
                var loadingOverlay = new LoadingOverlay();
                var appLoader = new AppLoader();

                parser.parse();

                //hide the overlay now that parsing is complete
                loadingOverlay.endLoading();

                //initialize the application
                appLoader.init();
            }
    );

</script>
<script src="https://www.ncei.noaa.gov/maps/config/gis-helper.js"></script>
<script id="_fed_an_ua_tag" type="text/javascript" src="https://dap.digitalgov.gov/Universal-Federated-Analytics-Min.js?agency=DOC&subagency=NOAA"></script></body>
</html>
