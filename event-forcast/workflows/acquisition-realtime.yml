name: Realtime Acquisition (30s cycle)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  realtime-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser urllib3

      - name: Run realtime acquisition
        env:
          SEAM_COLLECTOR_TIMEOUT_SECONDS: 45
          SEAM_RUN_ONCE: '1'
        run: |
          cd config/step1_raw_data_retrieval
          python realtime_acquisition.py

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: realtime acquisition update [skip ci]"
            git push
          fi
