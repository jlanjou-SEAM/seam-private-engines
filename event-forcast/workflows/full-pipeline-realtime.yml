name: Live SEAM Pipeline and Site

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: seam-live-pipeline
  cancel-in-progress: false

jobs:
  collect-analyze-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SEAM_ROOT: ${{ github.workspace }}
      SEAM_RUN_ONCE: '1'
      SEAM_COLLECTOR_TIMEOUT_SECONDS: '20'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 feedparser urllib3 pillow numpy scipy

      - name: Collect current observations
        working-directory: config/step1_raw_data_retrieval
        shell: bash
        run: |
          set -o pipefail
          python realtime_acquisition.py > realtime.log 2>&1 & realtime_pid=$!
          python nonrealtime_acquisition.py > nonrealtime.log 2>&1 & nonrealtime_pid=$!
          python official_acquisition.py > official.log 2>&1 & official_pid=$!
          python image_stream_acquisition.py > image_stream.log 2>&1 & image_pid=$!
          failed=0
          for pid in "$realtime_pid" "$nonrealtime_pid" "$official_pid" "$image_pid"; do
            wait "$pid" || failed=1
          done
          cat realtime.log nonrealtime.log official.log image_stream.log
          exit "$failed"

      - name: Consolidate observations
        run: python config/step2_continuum_master/step2_continuum_master.py

      - name: Generate manifold and event tracker
        run: python continuum/processes/step3_volcanic_analysis/step3_volcanic_analysis.py

      - name: Generate operational event matrix
        run: python continuum/processes/step4_operational_event_matrix/step4_operational_event_matrix.py

      - name: Build and validate live feed
        run: |
          python scripts/build_live_feed.py
          python -c "import json; p=json.load(open('public/data/live.json', encoding='utf-8')); assert p['schema']=='SEAM_LIVE_FEED_V1'; assert isinstance(p['events'], dict); print(f\"validated {p['event_count']} live events\")"

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R public _site/public
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
